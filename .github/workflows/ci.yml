name: CI

# Run on pushes to main and on pull requests that target main.
# The pull_request trigger is what lets a PR show a green/red check
# before someone merges it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository. It never
# needs to write code, publish packages, or deploy anything.
permissions:
  contents: read

# If a new commit lands while an older run for the same ref is still in
# progress, cancel the old run. This saves runner minutes on busy PRs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Keep going even if one Python version fails, so you see the full
      # picture instead of stopping at the first failure.
      fail-fast: false
      matrix:
        # Actively supported Python versions. The tutorial used 3.8/3.9,
        # both of which are now end-of-life.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Cache the pip download cache, keyed on requirements-dev.txt.
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -v
